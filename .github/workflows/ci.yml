name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The config and dependency are wanted; the ~500MB browser download is not.
      # No job here runs `playwright test`.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # src/generated/prisma is gitignored, so typecheck cannot resolve
        # '@/generated/prisma/client' until this runs. `generate` reads the URL
        # from prisma.config.ts but never connects, so a placeholder suffices.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Generate Next types
        # next-env.d.ts and .next/types are gitignored. The Next CLI docs
        # recommend `next typegen` before `tsc --noEmit` in CI.
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test
